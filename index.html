<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ali Emre Nebiler - Files</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --link: #58a6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        a {
            color: var(--link);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .tree {
            margin-top: 28px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgb(0 0 0 / 18%);
        }

        .tree ul {
            margin: 0;
            padding-left: 22px;
            list-style: none;
            border-left: 1px solid var(--border);
        }

        .tree details > ul {
            margin-left: 6px;
        }

        .tree > ul {
            margin-left: 0;
            padding-left: 0;
            border-left: 0;
        }

        .tree li {
            margin: 8px 0;
            padding-left: 0;
        }

        .tree > ul > li {
            padding-left: 0;
        }

        details {
            margin: 0;
        }

        summary {
            cursor: pointer;
            font-weight: 700;
            color: var(--text);
        }

        .file {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .file::before {
            content: "image";
            color: var(--muted);
            font-size: 0.8rem;
        }

        .tree-status {
            margin: 0;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Files</h1>
            <p>Public files by <a href="https://aliemrenebiler.com">Ali Emre Nebiler</a>.</p>
        </header>

        <nav class="tree" aria-label="File tree">
            <p class="tree-status">Loading files...</p>
        </nav>
    </main>

    <script>
        const tree = document.querySelector(".tree");

        function createFileNode(item, parentPath) {
            const listItem = document.createElement("li");
            const link = document.createElement("a");

            link.className = "file";
            link.href = `${parentPath}${item.name}`;
            link.textContent = item.name;

            listItem.append(link);

            return listItem;
        }

        function createFolderNode(item, parentPath) {
            const listItem = document.createElement("li");
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            const folderPath = `${parentPath}${item.name}/`;
            const childList = createTree(item.children || [], folderPath);

            details.open = item.open !== false;
            summary.textContent = `${item.name}/`;

            details.append(summary, childList);
            listItem.append(details);

            return listItem;
        }

        function createTree(items, parentPath = "") {
            const list = document.createElement("ul");

            items.forEach((item) => {
                const node = item.type === "folder"
                    ? createFolderNode(item, parentPath)
                    : createFileNode(item, parentPath);
                list.append(node);
            });

            return list;
        }

        fetch("files.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("Could not load files.json");
                }

                return response.json();
            })
            .then((files) => {
                tree.replaceChildren(createTree(files));
            })
            .catch(() => {
                const message = document.createElement("p");
                message.className = "tree-status";
                message.textContent = "Could not load the file list.";
                tree.replaceChildren(message);
            });
    </script>
</body>
</html>
