<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion Projects - Ali Emre Nebiler</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --link: #58a6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .videos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 24px;
      }

      .video-card {
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 18%);
      }

      .video-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .video-info {
        padding: 18px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        line-height: 1.3;
      }

      .note,
      .status {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Motion Projects</h1>
        <p>
          After Effects motion work with graphic design created in Adobe
          Illustrator.
        </p>
      </header>

      <section class="videos" aria-label="Motion project videos">
        <p class="status">Loading videos...</p>
      </section>
    </main>

    <script>
      const videosContainer = document.querySelector(".videos");

      function getYouTubeId(url) {
        const parsedUrl = new URL(url);

        if (parsedUrl.hostname === "youtu.be") {
          return parsedUrl.pathname.slice(1);
        }

        return parsedUrl.searchParams.get("v");
      }

      function createVideoCard(video) {
        const videoId = getYouTubeId(video.url);
        const article = document.createElement("article");
        const frame = document.createElement("div");
        const iframe = document.createElement("iframe");
        const info = document.createElement("div");
        const title = document.createElement("h2");
        const link = document.createElement("a");

        article.className = "video-card";
        frame.className = "video-frame";
        iframe.src = `https://www.youtube.com/embed/${videoId}`;
        iframe.title = video.title;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;

        info.className = "video-info";
        title.textContent = video.title;
        link.href = video.url;
        link.textContent = "Watch on YouTube";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        frame.append(iframe);
        info.append(title, link);
        article.append(frame, info);

        return article;
      }

      fetch("videos.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Could not load videos.json");
          }

          return response.json();
        })
        .then((videos) => {
          videosContainer.replaceChildren(...videos.map(createVideoCard));
        })
        .catch(() => {
          const message = document.createElement("p");
          message.className = "status";
          message.textContent = "Could not load the video list.";
          videosContainer.replaceChildren(message);
        });
    </script>
  </body>
</html>
